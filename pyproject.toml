[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "team-research-copilot"
version = "0.1.0"
description = "Cloud-first shared research analysis and team collaboration API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4", "pgvector>=0.3,<1",
  "pydantic-settings>=2.7,<3", "PyJWT[crypto]>=2.10,<3",
  "httpx>=0.28,<1", "openai>=1.68,<3", "beautifulsoup4>=4.12,<5",
  "pypdf>=5.3,<7", "defusedxml>=0.7,<1", "typer>=0.15,<1",
  "numpy>=2,<3", "tiktoken>=0.9,<1", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
copilot = "copilot.cli:app"

[tool.setuptools.packages.find]
include = ["copilot*"]

[tool.setuptools.package-data]
copilot = ["prompts/*.md", "migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: requires TEST_DATABASE_URL with pgvector (dedicated test database)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
